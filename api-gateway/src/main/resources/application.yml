server:
  # GATEWAY_PORT lets a machine where 8080 is taken pick another port; the default is unchanged.
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: API-GATEWAY
  cloud:
    circuitbreaker:
      bulkhead:
        resilience4j:
          # Found in the Phase 12 load test: Resilience4j adds a semaphore bulkhead of 25 concurrent calls per route by
          # default. 50 simultaneous requests then raised BulkheadFullException, which counted as circuit failures, the
          # circuit opened and every call got a 503. The plan asks for a circuit breaker and a 5 s timeout only
          # (section 4), so the concurrency cap is off; the time limiter and failure-rate breaker stay.
          enabled: false
    loadbalancer:
      # The default (non-Caffeine) cache never expires entries, so a stopped service would stay
      # routable. Read straight from the Eureka client registry instead (refreshed every 3 s below).
      cache:
        enabled: false
    gateway:
      server:
        webflux:   # property prefix for Spring Cloud Gateway 4.3.x (Spring Cloud 2025.0.x)
          httpclient:
            response-timeout: 5s
          default-filters:
            # Defensive: downstream services must not send CORS headers (CORS lives only here).
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          # Explicit routes only. No discovery locator, so nothing is exposed automatically,
          # and /internal/** is deliberately not routed (plan sections 4 and 5.4).
          routes:
          - id: auth-route
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/auth/**
            filters:
              - name: CircuitBreaker
                args:
                  name: AUTH-SERVICE
                  fallbackUri: forward:/fallback/AUTH-SERVICE
          - id: topology-route
            uri: lb://TOPOLOGY-SERVICE
            predicates:
              - Path=/api/topology/**
            filters:
              - name: CircuitBreaker
                args:
                  name: TOPOLOGY-SERVICE
                  fallbackUri: forward:/fallback/TOPOLOGY-SERVICE
          - id: sim-route
            uri: lb://SIMULATOR-SERVICE
            predicates:
              - Path=/api/sim/**
            filters:
              - name: CircuitBreaker
                args:
                  name: SIMULATOR-SERVICE
                  fallbackUri: forward:/fallback/SIMULATOR-SERVICE
          - id: telemetry-route
            uri: lb://TELEMETRY-SERVICE
            predicates:
              - Path=/api/telemetry/**
            filters:
              - name: CircuitBreaker
                args:
                  name: TELEMETRY-SERVICE
                  fallbackUri: forward:/fallback/TELEMETRY-SERVICE
          - id: alerts-route
            uri: lb://TELEMETRY-SERVICE
            predicates:
              - Path=/api/alerts/**
            filters:
              - name: CircuitBreaker
                args:
                  name: TELEMETRY-SERVICE
                  fallbackUri: forward:/fallback/TELEMETRY-SERVICE
          - id: workloads-route
            uri: lb://WORKLOAD-SERVICE
            predicates:
              - Path=/api/workloads/**
            filters:
              - name: CircuitBreaker
                args:
                  name: WORKLOAD-SERVICE
                  fallbackUri: forward:/fallback/WORKLOAD-SERVICE
          - id: scheduler-route
            uri: lb://SCHEDULER-SERVICE
            predicates:
              - Path=/api/scheduler/**
            filters:
              - name: CircuitBreaker
                args:
                  name: SCHEDULER-SERVICE
                  fallbackUri: forward:/fallback/SCHEDULER-SERVICE
          - id: cooling-route
            uri: lb://COOLING-CONTROLLER-SERVICE
            predicates:
              - Path=/api/cooling/**
            filters:
              - name: CircuitBreaker
                args:
                  name: COOLING-CONTROLLER-SERVICE
                  fallbackUri: forward:/fallback/COOLING-CONTROLLER-SERVICE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 3
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    # Dev lease timers, consistent with eureka-server (plan section 4).
    lease-renewal-interval-in-seconds: 3
    lease-expiration-duration-in-seconds: 9

thermogrid:
  security:
    # JWT authentication and role rules at the gateway. On for the secured setup (the default). Only tests or
    # a deliberate local experiment should set THERMOGRID_SECURITY_ENABLED=false.
    enabled: ${THERMOGRID_SECURITY_ENABLED:true}
    # HS256 signing secret shared with auth-service, at least 32 characters. No default: the gateway refuses to
    # start without it while security is enabled.
    jwt-secret: ${THERMOGRID_JWT_SECRET:}
  cors:
    allowed-origins: http://localhost:5173