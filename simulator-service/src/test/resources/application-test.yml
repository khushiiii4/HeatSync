spring:
  datasource:
    url: jdbc:h2:mem:sim_test;DB_CLOSE_DELAY=-1

eureka:
  client:
    enabled: false

thermogrid:
  simulator:
    scheduling-enabled: false
    publishing:
      enabled: false
    noise-seed: 1
    workloads:
      listener-enabled: false
      reconcile-ms: 60000
      retry-ms: 5000
      tombstone-ttl-ms: 300000
      queue-max-length: 1000
