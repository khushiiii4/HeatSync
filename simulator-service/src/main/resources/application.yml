server:
  port: 8083

spring:
  application:
    name: SIMULATOR-SERVICE
  # Embedded H2 file database. Nothing uses it until Bundle 2.3 (failure_injection log), but the
  # file lock also stops a second simulator process on the same working directory.
  datasource:
    url: ${SIM_DB_URL:jdbc:h2:file:./data/simdb}
    username: sa
    password: ""
    hikari:
      # One connection is enough and keeps the H2 file open (and locked) for the whole process lifetime.
      minimum-idle: 1
      maximum-pool-size: 4
      initialization-fail-timeout: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Phase 7: the broker confirms every publish and returns unroutable messages (ConfirmingRabbitTemplate).
    publisher-confirm-type: correlated
    publisher-returns: true
    # Fail fast when the broker is down so a tick is never held up for long.
    connection-timeout: 1000
    listener:
      simple:
        # A message the simulator cannot parse must dead-letter, not loop forever.
        default-requeue-rejected: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 3
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 3
    lease-expiration-duration-in-seconds: 9

# Every tunable value of the simulation lives here (plan section 6A).
thermogrid:
  # Phase 9: /internal/** requires X-Internal-Token and Feign sends it. Never blank while security is enabled.
  internal-token: ${THERMOGRID_INTERNAL_TOKEN:}
  security:
    enabled: ${THERMOGRID_SECURITY_ENABLED:true}
  simulator:
    tick-ms: 2000
    scheduling-enabled: true
    # Blank = unseeded Gaussian noise. Set a number for a reproducible run.
    noise-seed:
    grid:
      zones: 4
      rows: 4
      cols: 4
    initial:
      # Not specified by the plan. 26.0 is the zone target temperature and sits close to the
      # settling point of a 60-unit rack at 40 percent cooling (about 26.5 C), so the first minutes
      # are calm. See docs/decision-log.md D-018.
      temp-c: 26.0
      cooling-output-pct: 40
      cpu-units: 60
      health: OK
    physics:
      supply-temp-c: 18.0
      alpha: 0.06
      beta: 0.12
      gamma: 0.05
      noise-sigma-c: 0.05
      min-cooling-effectiveness: 0.10
      health-factors:
        ok: 1.0
        degraded: 0.25
        fault: 0.0
    publishing:
      enabled: true
      producer: SIMULATOR-SERVICE
      event-version: 1
      # After a failed publish, do not try the broker again for this long (bounded, nothing is queued in memory).
      retry-cooldown-ms: 10000
    failures:
      max-duration-sec: 86400
      max-heat-spike-kw: 50.0
    bootstrap:
      max-attempts: 12
      initial-backoff-ms: 1000
      max-backoff-ms: 15000
    workloads:
      listener-enabled: true
      reconcile-ms: 60000       # full resync from GET /internal/workloads?status=RUNNING (plan: 60 s)
      retry-ms: 5000            # retry period until the first successful load
      tombstone-ttl-ms: 300000  # how long a removed workload id is remembered
      queue-max-length: 50000
