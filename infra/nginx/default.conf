# Serves the React build on port 80 and proxies /api to the api-gateway (plan 3, 13.1). The browser only ever talks to
# this server, so the page and the API share one origin and no CORS is needed. /internal is never proxied.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The gateway is reached by its compose service name. Docker's embedded DNS (127.0.0.11) is used at request time
    # so nginx still starts if the gateway is briefly down, and answers 502 until it returns.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location /internal/ {
        return 404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path serves index.html so React Router can handle it.
    location / {
        try_files $uri /index.html;
    }
}
