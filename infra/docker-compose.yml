# ThermoGrid development infrastructure: MySQL 8 and RabbitMQ (plan section 3, phase 0).
# Run from the repository root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
name: thermogrid

services:
  mysql:
    image: mysql:8.4
    container_name: thermogrid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      TOPOLOGY_DB_PASSWORD: ${TOPOLOGY_DB_PASSWORD:?set TOPOLOGY_DB_PASSWORD in .env}
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD:?set TELEMETRY_DB_PASSWORD in .env}
      WORKLOAD_DB_PASSWORD: ${WORKLOAD_DB_PASSWORD:?set WORKLOAD_DB_PASSWORD in .env}
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:?set SCHEDULER_DB_PASSWORD in .env}
      COOLING_DB_PASSWORD: ${COOLING_DB_PASSWORD:?set COOLING_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1 forces TCP, which only works after the real server is up (not the temporary init server)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: thermogrid-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
  rabbitmq-data: