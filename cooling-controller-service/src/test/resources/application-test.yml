# Test profile: in-memory H2 (MySQL mode), never the developer cooling_db; no broker, no Eureka, no timers.
spring:
  datasource:
    url: jdbc:h2:mem:cooling_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
thermogrid:
  # Test profile only: dedicated tests switch internal-token enforcement back on.
  security:
    enabled: false
  cooling:
    scheduling-enabled: false
    listeners-enabled: false
    single-instance-lock: false
    seed-on-startup: false
