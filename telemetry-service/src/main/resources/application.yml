server:
  port: 8084

spring:
  application:
    name: TELEMETRY-SERVICE
  datasource:
    # Own schema, own user (plan section 7). The password has no default and must come from the environment.
    url: ${DB_URL:jdbc:mysql://localhost:3306/telemetry_db}
    username: ${DB_USER:telemetry}
    password: ${DB_PASSWORD:${TELEMETRY_DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # plan section 3: ddl-auto=update, no Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Phase 7: the broker confirms every publish and returns unroutable messages (ConfirmingRabbitTemplate).
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 2000
    listener:
      simple:
        concurrency: 1
        max-concurrency: 3
        prefetch: 20
        # Retry and dead-lettering are configured in AmqpConfig (3 attempts, 1 s / 2 s / 4 s, then thermogrid.dlq).

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 3
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    # Dev lease timers, consistent with eureka-server (plan section 4).
    lease-renewal-interval-in-seconds: 3
    lease-expiration-duration-in-seconds: 9

# Every tunable value of forecasting, risk, stale detection and retention (plan sections 6B and 7).
thermogrid:
  # Phase 9: /internal/** requires X-Internal-Token and Feign sends it. Never blank while security is enabled.
  internal-token: ${THERMOGRID_INTERNAL_TOKEN:}
  security:
    enabled: ${THERMOGRID_SECURITY_ENABLED:true}
  telemetry:
    scheduling-enabled: true
    listeners-enabled: true
    forecast:
      alpha: 0.4            # level smoothing "a"
      beta: 0.15            # trend smoothing "b"
      phi: 0.95             # trend damping
      horizon-ticks: 30     # 30 ticks of 2 s = 60 s
      ticks-per-minute: 30  # converts the per-tick trend to the API's trendCPerMin
    risk:
      watch-c: 30.0
      warning-c: 34.0
      critical-c: 38.0
      calm-margin-c: 2.0    # a lowering reading must be this far below the current level's threshold
      calm-readings: 5
    stale:
      after-sec: 10
      check-interval-ms: 2000
    retention:
      readings-hours: 6     # plan section 7
      alerts-days: 7        # plan section 7 (CLEARED alerts only; ACTIVE alerts are never deleted)
      batch-size: 5000
      max-batches-per-run: 20
      interval-ms: 600000
    history:
      max-minutes: 360
      warmup-readings: 60   # extra readings replayed before the window so the forecast series is settled
    alerts:
      max-limit: 500
      publish-attempts: 3
      publish-retry-ms: 200
    amqp:
      retry-attempts: 3
      retry-initial-ms: 1000
      retry-multiplier: 2.0
      retry-max-ms: 4000
      rack-queue-max-length: 50000
      zone-queue-max-length: 20000
    producer: TELEMETRY-SERVICE
    event-version: 1
