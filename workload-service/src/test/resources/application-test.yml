# Test profile: in-memory H2 (MySQL mode), never the developer MySQL; no broker, no Eureka, no timers.
spring:
  datasource:
    url: jdbc:h2:mem:workload_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
thermogrid:
  workload:
    scheduling-enabled: false
    internal-token: ""
